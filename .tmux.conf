# Start window numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 10000

# 256 color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Status bar position
set-option -g status-position top

# Set the entire status bar background to transparent
set -g status-style bg=default

# Set the default text color for the window list (foreground)
set -g status-fg colour244 

# Change the appearance of the ACTIVE window (the one with the *)
# This makes it stand out with a specific color (e.g., yellow) while keeping its background transparent
set-window-option -g window-status-current-style fg=yellow,bg=default

# Optional: Style the non-active windows to be slightly dimmer
set-window-option -g window-status-style fg=colour244,bg=default

# Timing for parsing escape sequences
set -sg escape-time 100
